<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tagmark</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="lib">
  <aside id="sidebar"></aside>

  <main>
    <header class="top">
      <h1 id="heading"></h1>
      <div class="tools">
        <div id="tools" class="tools-left"></div>
        <div class="search" id="searchbox">
          <input id="search" type="search" placeholder="Search bookmarks" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
      </div>
    </header>
    <div id="content"></div>
  </main>

  <div id="bar" role="toolbar" aria-label="Selected bookmarks"></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="editor"></dialog>
  <dialog id="shortcuts"></dialog>

  <script type="module" src="library.js"></script>
</body>
</html>
